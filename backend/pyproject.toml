[project]
name = "app"
version = "0.1.0"
description = "Approval System API"
readme = "README.md"
authors = [
    { name = "fengxy", email = "642526109@qq.com" }
]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1", "pymysql[rsa]>=1.1,<2", "alembic>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
